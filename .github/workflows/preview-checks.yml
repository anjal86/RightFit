name: RightFit preview smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reusable HTML components and generated output
        run: node tests/check-components.mjs
      - name: Check preview pages and links
        run: node tests/check-static.mjs
      - name: Verify loader plays once with slowed original frames
        run: python3 tools/verify_loader.py
      - name: Install headless browser for first-fold layout checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify homepage hero fits common viewport sizes
        run: node tests/check-home-viewport.mjs
      - name: Verify sticky header on all pages and device widths
        run: node tests/check-sticky-header.mjs
      - name: Verify photography URLs
        run: node tests/check-photo-urls.mjs
      - name: Verify PHP and HTML share the same page design
        run: node tests/check-shared-render.mjs
      - name: Lint PHP source
        run: |
          for f in config.php submit.php index.php about.php services.php contact.php admin/*.php includes/*.php; do php -l "$f"; done
