name: Retime RightFit loader (one-time binary asset preparation)
on:
  push:
    branches:
      - fix/loader-slow-play-once-2026-11-03
    paths:
      - tools/retime_loader.py
permissions:
  contents: write
jobs:
  retime-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Losslessly retime animated assets and remove looping
        run: python3 tools/retime_loader.py
      - name: Commit updated GIF and WebP to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/loader.gif assets/loader.webp
          git diff --cached --exit-code && { echo "No asset changes"; exit 1; } || true
          git commit -m "assets: slow original loader frames and stop after one cycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
